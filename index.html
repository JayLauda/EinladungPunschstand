<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBB Winterpunsch – Einladung</title>

  <!-- Vorschau, die WhatsApp unter dem Link anzeigt (absolute URL nötig) -->
  <meta property="og:title" content="BBB Winterpunsch 🎄 – Sa, 5. Dezember ab 17 Uhr">
  <meta property="og:description" content="Bergan 40, 4702 Wallern. Bitte um kurze Zu- oder Absage – einfach hier antippen!">
  <meta property="og:image" content="https://jaylauda.github.io/EinladungPunschstand/bilder/vorschau.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0f2418">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tanne: #0f2418;
      --tanne-2: #173322;
      --gold: #e2b866;
      --gold-hell: #f0cf8a;
      --creme: #f6ead2;
      --text: #2a2320;
      --leise: #6b5d55;
      --gruen: #2f8a52;
      --gruen-hell: #37a05f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--creme);
      background:
        radial-gradient(900px 500px at 50% -10%, #23472f 0%, transparent 60%),
        linear-gradient(180deg, var(--tanne) 0%, #0a1810 100%);
      background-attachment: fixed;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 16px 16px 40px;
      overflow-x: hidden;
    }
    .seite { width: 100%; max-width: 520px; }

    .btn {
      appearance: none; border: 0; cursor: pointer;
      font: inherit; font-weight: 700; font-size: 16px;
      padding: 15px 10px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); }

    /* ---- Einladung mit Buttons an Stelle von "Bitte um kurze Zu- oder Absage" ---- */
    .einladung-rahmen { position: relative; container-type: inline-size; }
    .antwort-buttons {
      position: absolute; left: 9%; right: 9%; top: 89%; height: 7.6%;
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw;
      padding: .9cqw; border-radius: 999px;
      background: linear-gradient(180deg, #f1dfc0 0%, #dcc093 100%);
      box-shadow: 0 4px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6);
      animation: puls 2.4s ease-in-out infinite;
    }
    .antwort-buttons .btn {
      padding: 0 4px; gap: .35em; white-space: nowrap;
      font-size: clamp(12px, 4cqw, 22px); border-radius: 999px;
    }
    .antwort-buttons .btn-ja   { background: var(--gruen); color: #fff; }
    .antwort-buttons .btn-ja:hover { background: var(--gruen-hell); }
    .antwort-buttons .btn-nein { background: #fbf2e1; color: #1f1a15; }
    .antwort-buttons .btn-nein:hover { background: #fff; }
    .antwort-buttons .symbol { font-size: 1.1em; line-height: 1; }
    .antwort-buttons .btn-nein .symbol { color: #a32035; }
    @keyframes puls {
      0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 0 rgba(226,184,102,0); }
      50%      { box-shadow: 0 4px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 5px rgba(226,184,102,.5); }
    }
    @media (prefers-reduced-motion: reduce) { .antwort-buttons .btn { animation: none; } }

    /* ---- Antwort-Fenster ---- */
    dialog {
      width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
      padding: 0; border: 0; background: transparent; overflow: visible;
    }
    dialog::backdrop { background: rgba(5,14,9,.72); backdrop-filter: blur(3px); }
    .schliessen {
      position: absolute; top: 10px; right: 10px;
      width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
      background: #eadcc0; color: var(--text); font-size: 20px; line-height: 1;
    }

    /* ---- Antwortformular ---- */
    .formular {
      position: relative; margin: 0; padding: 18px; max-height: calc(100vh - 32px); overflow-y: auto;
      background: var(--creme); color: var(--text);
      border: 2px solid var(--gold); border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    .formular[hidden] { display: none; }
    .formular h2 { font-family: "Dancing Script", cursive; font-size: 30px; margin: 0 40px 12px 0; color: #1d4a2e; }
    .wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .wahl .btn { font-size: 14px; padding: 12px 4px; white-space: nowrap; background: #eadcc0; color: var(--text); }
    .wahl .btn[aria-pressed="true"].btn-ja   { background: var(--gruen); color: #fff; }
    .wahl .btn[aria-pressed="true"].btn-nein { background: #a32035; color: #fff; }
    .feld { margin-bottom: 14px; }
    .feld[hidden] { display: none; }
    .feld label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .feld input, .feld textarea {
      width: 100%; font: inherit; font-size: 16px;
      padding: 12px 14px; border: 1px solid #d6c7a8; border-radius: 12px; background: #fffdf7; color: var(--text);
    }
    .feld textarea { resize: vertical; min-height: 60px; }
    .feld input:focus, .feld textarea:focus { outline: 3px solid rgba(226,184,102,.55); border-color: var(--gold); }

    .zaehler { display: flex; align-items: center; gap: 12px; }
    .zaehler button {
      width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--tanne); color: #fff; font-size: 24px; line-height: 1;
    }
    .zaehler button:disabled { opacity: .35; cursor: default; }
    .zaehler output { min-width: 3ch; text-align: center; font-size: 28px; font-weight: 700; }
    .zaehler .hinweis { color: var(--leise); font-size: 14px; }

    .btn-senden { width: 100%; background: #25d366; color: #0b3d20; font-size: 17px; }
    .btn-senden:hover { background: #2fe072; }
    .btn-senden svg { width: 22px; height: 22px; }
    .klein { font-size: 13px; color: var(--leise); text-align: center; margin: 10px 0 0; }

    /* ---- Einladungsbild ---- */
    .einladung {
      display: block; width: 100%; height: auto;
      border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .karte-link {
      display: block; text-align: center; margin-top: 14px;
      color: var(--gold-hell); font-weight: 600; text-decoration: none;
    }
    .karte-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="seite">
    <div class="einladung-rahmen">
      <img class="einladung" src="bilder/einladung.jpg" width="843" height="1264"
           alt="Einladung BBB Winterpunsch: Samstag, 5. Dezember, ab 17 Uhr, Bergan 40, 4702 Wallern. Es gibt Punsch, Glühmost, Bier, Anti und Leberkäse-Semmel. Auch ein Sitzbereich im Warmen ist vorhanden. Gerne auch Familie und Freunde mitnehmen!">
      <div class="antwort-buttons" role="group" aria-label="Bitte um kurze Zu- oder Absage">
        <button class="btn btn-ja"   id="btn-ja"><span class="symbol">✔</span> Ich komme</button>
        <button class="btn btn-nein" id="btn-nein"><span class="symbol">✖</span> Ich komme nicht</button>
      </div>
    </div>

    <a class="karte-link" href="https://www.google.com/maps/search/?api=1&query=Bergan+40%2C+4702+Wallern" target="_blank" rel="noopener">📍 Bergan 40, 4702 Wallern – Route anzeigen</a>
  </div>

  <dialog id="fenster">
    <form class="formular" id="formular">
      <button type="button" class="schliessen" id="schliessen" aria-label="Schließen">✕</button>
      <h2 id="f-titel"></h2>
      <div class="wahl" role="group" aria-label="Deine Antwort">
        <button type="button" class="btn btn-ja"   id="wahl-ja"   aria-pressed="false">✔ Ich komme</button>
        <button type="button" class="btn btn-nein" id="wahl-nein" aria-pressed="false">✖ Ich komme nicht</button>
      </div>

      <div class="feld">
        <label for="f-name">Dein Name</label>
        <input id="f-name" name="name" autocomplete="name" required placeholder="z. B. Anna Huber">
      </div>

      <div class="feld" id="feld-anzahl">
        <label id="l-anzahl">Mit wie vielen Personen kommst du (inkl. dir)?</label>
        <div class="zaehler" role="group" aria-labelledby="l-anzahl">
          <button type="button" id="minus" aria-label="Eine Person weniger">−</button>
          <output id="anzahl" aria-live="polite">1</output>
          <button type="button" id="plus" aria-label="Eine Person mehr">+</button>
          <span class="hinweis" id="anzahl-text">Person</span>
        </div>
      </div>

      <div class="feld">
        <label for="f-notiz">Nachricht (optional)</label>
        <textarea id="f-notiz" name="notiz"></textarea>
      </div>

      <button class="btn btn-senden" type="submit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg>
        Antwort per WhatsApp senden
      </button>
      <p class="klein">WhatsApp öffnet sich mit deiner fertigen Antwort – nur noch auf „Senden“ tippen.</p>
    </form>
  </dialog>

  <script>
    /* =====================================================================
       HIER ANPASSEN
       ===================================================================== */
    const CONFIG = {
      // WhatsApp-Nummer, an die die Antworten gehen: internationales Format,
      // NUR Ziffern, ohne +, ohne 00, ohne führende 0.
      // Beispiel Österreich: 0664 1234567 → "436641234567"
      telefon: "436603220553",
      veranstaltung: "BBB Winterpunsch",
      datum: "Sa, 5. Dezember",
      maxPersonen: 15,
    };
    /* ===================================================================== */

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    const gastName = (params.get("name") || "").trim();
    if (gastName) $("f-name").value = gastName;

    let antwort = null;
    let anzahl = 1;

    function zeigeAnzahl() {
      $("anzahl").textContent = anzahl;
      $("anzahl-text").textContent = anzahl === 1 ? "Person" : "Personen";
      $("minus").disabled = anzahl <= 1;
      $("plus").disabled  = anzahl >= CONFIG.maxPersonen;
    }

    function waehle(wert) {
      antwort = wert;
      $("wahl-ja").setAttribute("aria-pressed", wert === "ja");
      $("wahl-nein").setAttribute("aria-pressed", wert === "nein");
      $("feld-anzahl").hidden = wert !== "ja";
      $("f-titel").textContent = wert === "ja" ? "Super, bis bald! 🎉" : "Schade! Danke fürs Bescheidsagen.";
      $("f-notiz").placeholder = wert === "ja" ? "z. B. Wir kommen etwas später 🙂" : "z. B. Viel Spaß euch!";
    }

    function oeffne(wert) {
      waehle(wert);
      if (!$("fenster").open) $("fenster").showModal();
    }

    $("btn-ja").addEventListener("click", () => oeffne("ja"));
    $("btn-nein").addEventListener("click", () => oeffne("nein"));
    $("wahl-ja").addEventListener("click", () => waehle("ja"));
    $("wahl-nein").addEventListener("click", () => waehle("nein"));
    $("schliessen").addEventListener("click", () => $("fenster").close());
    // Klick auf den abgedunkelten Hintergrund schließt das Fenster
    $("fenster").addEventListener("click", (e) => { if (e.target === $("fenster")) $("fenster").close(); });
    $("minus").addEventListener("click", () => { if (anzahl > 1) anzahl--; zeigeAnzahl(); });
    $("plus").addEventListener("click", () => { if (anzahl < CONFIG.maxPersonen) anzahl++; zeigeAnzahl(); });
    zeigeAnzahl();

    // Direktlinks aus der WhatsApp-Nachricht: ?antwort=ja / ?antwort=nein
    const vorauswahl = (params.get("antwort") || "").toLowerCase();
    if (vorauswahl === "ja" || vorauswahl === "nein") oeffne(vorauswahl);

    $("formular").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("f-name").value.trim();
      if (!name) { $("f-name").focus(); return; }
      const notiz = $("f-notiz").value.trim();

      let text = antwort === "ja"
        ? `✅ KOMME – ${name}\nPersonen: ${anzahl}\n(${CONFIG.veranstaltung}, ${CONFIG.datum})`
        : `❌ KOMME NICHT – ${name}\n(${CONFIG.veranstaltung}, ${CONFIG.datum})`;
      if (notiz) text += `\n\n${notiz}`;

      location.href = `https://wa.me/${CONFIG.telefon}?text=${encodeURIComponent(text)}`;
    });
  </script>
</body>
</html>
